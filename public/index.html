<!-- CONTENEDOR MAESTRO RESPONSIVO (PC & ANDROID) -->
<div class="h-dvh w-screen overflow-hidden flex flex-col lg:flex-row bg-slate-950 text-slate-100 font-sans select-none">

  <!-- 1. SIDEBAR DE LOS 6 MÓDULOS (Lateral en PC / Barra superior compacta en Android) -->
  <aside class="w-full lg:w-20 xl:w-60 bg-slate-900/90 border-b lg:border-b-0 lg:border-r border-cyan-500/30 flex lg:flex-col justify-between items-center lg:items-stretch p-2 lg:p-4 shrink-0 z-20">
    <div class="flex items-center gap-3 px-2">
      <div class="h-3 w-3 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee]"></div>
      <span class="font-black tracking-wider text-cyan-400 text-sm xl:text-lg truncate">LA BARRITA</span>
    </div>

    <!-- Navegación de los 6 Módulos -->
    <nav class="flex lg:flex-col gap-1.5 overflow-x-auto max-w-full py-1 lg:py-4 no-scrollbar">
      <button onclick="cambiarModulo('caja')" class="mod-btn active px-3 py-2.5 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-bold text-xs flex items-center gap-2 shrink-0">
        <span>💰</span> <span class="hidden xl:inline">1. Caja y Mesas</span>
      </button>
      <button onclick="cambiarModulo('inventario')" class="mod-btn px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-400 font-semibold text-xs flex items-center gap-2 shrink-0">
        <span>📦</span> <span class="hidden xl:inline">2. Inventarios</span>
      </button>
      <button onclick="cambiarModulo('cocina')" class="mod-btn px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-400 font-semibold text-xs flex items-center gap-2 shrink-0">
        <span>🔥</span> <span class="hidden xl:inline">3. Cocina / Barra</span>
      </button>
      <button onclick="cambiarModulo('admin')" class="mod-btn px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-400 font-semibold text-xs flex items-center gap-2 shrink-0">
        <span>📊</span> <span class="hidden xl:inline">4. Administración</span>
      </button>
      <button onclick="cambiarModulo('config')" class="mod-btn px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-400 font-semibold text-xs flex items-center gap-2 shrink-0">
        <span>⚙️</span> <span class="hidden xl:inline">5. Configuración</span>
      </button>
      <button onclick="cambiarModulo('respaldo')" class="mod-btn px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-400 font-semibold text-xs flex items-center gap-2 shrink-0">
        <span>☁️</span> <span class="hidden xl:inline">6. Respaldo GitHub</span>
      </button>
    </nav>

    <div class="hidden lg:block text-[11px] text-slate-500 text-center border-t border-slate-800 pt-3">
      Rol activo: <span class="text-cyan-400 font-bold">ADMINISTRADOR</span>
    </div>
  </aside>

  <!-- 2. ÁREA CENTRAL DE TRABAJO (MÓDULO 1: CAJA, FLOOR PLAN, MENÚ Y CHECKOUT) -->
  <main id="modulo-caja" class="flex-1 min-h-0 min-w-0 flex flex-col overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">

    <!-- Sub-Barra de Estado de Caja (Fondo, Gastos Rápidos, Corte) -->
    <header class="h-12 px-4 border-b border-cyan-500/20 flex items-center justify-between gap-2 shrink-0 bg-slate-900/40 overflow-x-auto">
      <div class="flex items-center gap-2 text-xs">
        <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 font-semibold">
          Fondo: $1,500.00
        </span>
        <button onclick="registrarGastoRapido()" class="px-2.5 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 font-semibold transition">
          + Registrar Gasto
        </button>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <button onclick="abrirCorteDeCaja()" class="px-3 py-1 rounded-lg bg-purple-500/20 hover:bg-purple-500/30 border border-purple-400/40 text-purple-300 font-bold transition">
          🧾 Corte de Caja
        </button>
      </div>
    </header>

    <!-- GRID FLUIDO DE 3 PANELES (En PC se ven juntos / En Android se alternan por pestaña sin encimarse) -->
    <div class="flex-1 min-h-0 p-2 md:p-4 grid grid-cols-1 lg:grid-cols-12 gap-3 overflow-hidden">

      <!-- PANEL A: FLOOR PLAN / MAPA DE MESAS (5 columnas en PC) -->
      <section id="panel-vista-mapa" class="lg:col-span-5 min-h-0 flex flex-col bg-slate-900/60 border border-cyan-500/25 rounded-2xl p-3 overflow-hidden">
        <div class="flex items-center justify-between mb-2 shrink-0">
          <h2 class="text-sm font-bold text-cyan-300 tracking-wide">📍 MAPA DE MESAS</h2>
          <button id="btn-toggle-editor-mesas" class="px-2.5 py-1 text-[11px] rounded-lg bg-slate-800 hover:bg-cyan-950 text-cyan-300 border border-cyan-500/30">
            ✏️ Editar Posiciones
          </button>
        </div>

        <!-- Lienzo Proporcional (Mantiene proporciones exactas en PC y Android sin aplastar mesas) -->
        <div class="flex-1 min-h-0 relative overflow-auto rounded-xl bg-slate-950/80 border border-dashed border-cyan-500/20 flex items-center justify-center p-2">
          <div id="floor-plan-container" class="relative w-full h-full min-w-[480px] min-h-[340px]">
            <!-- Tus mesas dinámicas se inyectan aquí usando left: X% y top: Y% -->
          </div>
        </div>
      </section>

      <!-- PANEL B: CATÁLOGO / PRODUCT MENU (4 columnas en PC) -->
      <section id="panel-vista-menu" class="hidden lg:flex lg:col-span-4 min-h-0 flex-col bg-slate-900/60 border border-cyan-500/25 rounded-2xl p-3 overflow-hidden">
        <div class="flex flex-col gap-2 mb-3 shrink-0">
          <input id="buscar-producto" type="text" placeholder="🔍 Buscar platillo o bebida..." class="w-full px-3 py-1.5 rounded-xl bg-slate-950 border border-cyan-500/30 text-xs text-white focus:outline-none focus:border-cyan-400">
          <div id="categorias-menu" class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
            <button class="px-3 py-1 rounded-lg bg-cyan-500 text-slate-950 font-bold shrink-0">Todo</button>
            <button class="px-3 py-1 rounded-lg bg-slate-800 text-slate-300 shrink-0">Cervezas</button>
            <button class="px-3 py-1 rounded-lg bg-slate-800 text-slate-300 shrink-0">Coctelería</button>
            <button class="px-3 py-1 rounded-lg bg-slate-800 text-slate-300 shrink-0">Snacks</button>
          </div>
        </div>

        <!-- Grid de Productos con Scroll Independiente -->
        <div id="product-menu-grid" class="flex-1 min-h-0 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 xl:grid-cols-3 gap-2.5 pr-1 content-start">
          <!-- Tarjetas de producto generadas dinámicamente -->
        </div>
      </section>

      <!-- PANEL C: CHECKOUT Y CUENTA ACTIVA (3 columnas en PC) -->
      <section id="panel-vista-checkout" class="hidden lg:flex lg:col-span-3 min-h-0 flex-col bg-slate-900/80 border border-cyan-500/30 rounded-2xl p-3 overflow-hidden justify-between">
        <div class="flex items-center justify-between border-b border-cyan-500/20 pb-2 shrink-0">
          <div>
            <span class="text-[10px] text-slate-400 uppercase">Orden Activa</span>
            <h3 id="checkout-mesa-nombre" class="text-sm font-black text-cyan-400">MESA #1</h3>
          </div>
          <span class="px-2 py-0.5 text-[10px] rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">Ocupada</span>
        </div>

        <!-- Lista de Productos en la Comanda (Scroll propio sin empujar el botón de cobro fuera de la pantalla) -->
        <div id="ticket-items" class="flex-1 min-h-0 overflow-y-auto my-2 space-y-2 pr-1">
          <!-- Items de la cuenta -->
        </div>

        <!-- Pie de Checkout Fijo -->
        <div class="pt-3 border-t border-cyan-500/30 shrink-0 space-y-2">
          <div class="flex justify-between items-center text-base font-black">
            <span class="text-slate-300">TOTAL:</span>
            <span id="total-amount" class="text-xl text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]">$0.00</span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button id="btn-enviar-cocina" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-cyan-500/30 text-cyan-300 font-bold text-xs transition">
              🔥 Comandar
            </button>
            <button id="btn-cobrar" data-action="cobrar" class="py-2.5 px-3 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-600 hover:from-cyan-300 hover:to-blue-500 text-slate-950 font-black text-xs shadow-[0_0_15px_rgba(6,182,212,0.4)] transition active:scale-95">
              💳 COBRAR
            </button>
          </div>
        </div>
      </section>

    </div>

    <!-- BARRA INFERIOR EXCLUSIVA PARA ANDROID / TABLETS VERTICALES (< 1024px) -->
    <footer class="lg:hidden h-14 bg-slate-900 border-t border-cyan-500/30 grid grid-cols-3 gap-1 p-1.5 shrink-0">
      <button onclick="cambiarTabMovil('mapa')" id="tab-movil-mapa" class="rounded-xl bg-cyan-500/20 text-cyan-300 font-bold text-xs flex items-center justify-center gap-1">
        📍 Mesas
      </button>
      <button onclick="cambiarTabMovil('menu')" id="tab-movil-menu" class="rounded-xl text-slate-400 font-semibold text-xs flex items-center justify-center gap-1">
        🍔 Menú
      </button>
      <button onclick="cambiarTabMovil('checkout')" id="tab-movil-checkout" class="rounded-xl text-slate-400 font-semibold text-xs flex items-center justify-center gap-1">
        💳 Cuenta / Cobrar
      </button>
    </footer>

  </main>
</div>

<!-- 3. MODAL DE COBRO INSTANTÁNEO (CORREGIDO Y COMPLETO) -->
<div id="modal-cobro" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 items-center justify-center p-4">
  <div class="bg-slate-900 border border-cyan-400/50 rounded-2xl w-full max-w-md p-6 shadow-[0_0_40px_rgba(6,182,212,0.25)] space-y-4">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <div>
        <span class="text-[11px] text-cyan-400 uppercase tracking-widest">Cierre de Cuenta</span>
        <h3 id="cobro-mesa-titulo" class="text-xl font-black text-white">MESA #1</h3>
      </div>
      <button onclick="cerrarVentanaCobro()" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
    </div>

    <div class="bg-slate-950 border border-cyan-500/20 rounded-xl p-4 flex justify-between items-center">
      <span class="text-sm text-slate-400">Total a Pagar:</span>
      <span id="cobro-total-display" class="text-3xl font-black text-cyan-400">$0.00</span>
    </div>

    <div class="grid grid-cols-3 gap-2 text-xs font-bold">
      <button onclick="metodoPagoSeleccionado='efectivo'" class="py-2.5 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-300">💵 Efectivo</button>
      <button onclick="metodoPagoSeleccionado='tarjeta'" class="py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300">💳 Tarjeta / MP</button>
      <button onclick="metodoPagoSeleccionado='transferencia'" class="py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300">📲 Transferencia</button>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs text-slate-400 block mb-1">Monto Recibido ($)</label>
        <input id="input-monto-recibido" type="number" step="0.50" oninput="calcularCambioEnVivo()" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-cyan-500/40 text-white font-bold text-lg focus:outline-none">
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">Propina</label>
        <select id="select-propina" onchange="calcularCambioEnVivo()" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-cyan-500/40 text-white font-bold text-sm focus:outline-none">
          <option value="0">Sin propina (0%)</option>
          <option value="10">Sugerida 10%</option>
          <option value="15">Excelente 15%</option>
        </select>
      </div>
    </div>

    <div class="flex justify-between items-center px-2 py-2 bg-emerald-950/40 border border-emerald-500/30 rounded-xl">
      <span class="text-xs text-emerald-300 font-semibold">Cambio a entregar:</span>
      <span id="cobro-cambio-display" class="text-xl font-black text-emerald-400">$0.00</span>
    </div>

    <div class="flex gap-3 pt-2">
      <button onclick="cerrarVentanaCobro()" class="w-1/3 py-3 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Cancelar</button>
      <button onclick="confirmarPagoYLiberarMesa()" class="w-2/3 py-3 rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-500 text-slate-950 font-black text-sm shadow-[0_0_20px_rgba(16,185,129,0.4)]">
        ✅ CONFIRMAR E IMPRIMIR
      </button>
    </div>
  </div>
</div>
