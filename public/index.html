<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Barrita - POS Ultra Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style id="custom-skin-style">
        :root { --bg-main: #07070a; --card-bg: #0f0f15; --card-border: #1f1f2e; --accent: #a855f7; --accent-glow: rgba(168, 85, 247, 0.35); --marquee-size-sup: 20px; --marquee-size-inf: 15px; }
        body { background-color: var(--bg-main) !important; color: #ffffff; font-family: sans-serif; user-select: none; overflow-x: hidden; }
        .bg-app-base { background-color: var(--bg-main) !important; } .bg-card { background-color: var(--card-bg) !important; border-color: var(--card-border) !important; border-width: 1px; }
        .bg-app-panel { background-color: #0a0a10 !important; } .bg-app-input { background-color: #0d0d14 !important; }
        .text-xxs { font-size: 10px !important; } .max-h-panel { max-height: 580px !important; overflow-y: auto; } .min-h-stage { min-height: 460px !important; } .max-h-inv { max-height: 500px !important; overflow-y: auto; }
        .text-accent { color: var(--accent) !important; } .bg-accent { background-color: var(--accent) !important; } .border-accent { border-color: var(--accent) !important; }
        .box-glow { box-shadow: 0 0 25px -5px var(--accent-glow) !important; } .pill-badge { border-radius: 9999px; padding: 0.25rem 0.75rem; font-weight: 800; font-size: 0.7rem; }
        .card-press:active { transform: scale(0.96); }
        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; }
        .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 24s linear infinite; font-size: var(--marquee-size-sup); }
        .marquee-content-reverse { display: inline-block; padding-left: 100%; animation: marqueeRev 22s linear infinite; font-size: var(--marquee-size-inf); }
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-100%); } } @keyframes marqueeRev { 0% { transform: translateX(-100%); } 100% { transform: translateX(0%); } }
        .stage-media-wrapper { width: 100%; height: 100%; max-height: 70vh; display: flex; align-items: center; justify-content: center; background: #000000; overflow: hidden; border-radius: 1.5rem; }
        .media-asset { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
        #area-impresion-ticket { display: none; }
        @media print { body * { visibility: hidden !important; } #area-impresion-ticket, #area-impresion-ticket * { visibility: visible !important; } #area-impresion-ticket { display: block !important; position: absolute; left: 0; top: 0; width: 100%; max-width: 58mm; margin: 0; padding: 4px; color: #000 !important; background: #fff !important; font-family: 'Courier New', Courier, monospace; font-size: 11px; } @page { margin: 0; size: auto; } }
    </style>
    <script>
        var socket = null; var usuarioActivo = null; var rolActivo = 'cliente'; var miMesaAsignada = 'Para Llevar';
        var caja = { abierta: false, fondoInicial: 0 }; var productos = []; var comandas = []; var historialVentas = []; var egresos = []; var usuariosSistema = []; var archivosPublicidad = [];
        var config = { nombreNegocio: "LA BARRITA PRO", promoTexto: "🔥 2x1 EN MICHELADAS Y ALITAS HASTA LAS 9:00 PM 🍺", promoTextoInferior: "📲 Wi-Fi: LaBarrita_VIP", tamanoTextoSup: 20, tamanoTextoInf: 15, redesUrl: "", mediaUrl: "", videoConAudio: false, skinSeleccionada: "tech-neon" };
        var ipServidor = window.location.host; var carrito = []; var comandaCobroActiva = null; var metodoPago = 'Efectivo'; var timerPublicidad = null; var chartVentas = null;
        var calcDisplay = '0'; var calcPrevio = null; var calcOperacion = null; var calcReset = false;

        var SKINS = {
            "tech-neon": { bgMain: "#07070a", cardBg: "#0f0f15", border: "#1f1f2e", accent: "#a855f7", glow: "rgba(168, 85, 247, 0.35)" },
            "onyx-gold": { bgMain: "#050505", cardBg: "#111111", border: "#2d2416", accent: "#f59e0b", glow: "rgba(245, 158, 11, 0.35)" },
            "cyber-cyan": { bgMain: "#030712", cardBg: "#0b1329", border: "#1e293b", accent: "#06b6d4", glow: "rgba(6, 182, 212, 0.35)" },
            "emerald-bar": { bgMain: "#040d0a", cardBg: "#081c15", border: "#14382c", accent: "#10b981", glow: "rgba(16, 185, 129, 0.35)" }
        };

        function aplicarSkinGlobal(nombre, emitir) {
            var s = SKINS[nombre] || SKINS["tech-neon"]; config.skinSeleccionada = nombre; var r = document.documentElement;
            r.style.setProperty('--bg-main', s.bgMain); r.style.setProperty('--card-bg', s.cardBg); r.style.setProperty('--card-border', s.border); r.style.setProperty('--accent', s.accent); r.style.setProperty('--accent-glow', s.glow);
            var sup = document.getElementById('marqueePromoSuperior');
            if (sup && sup.parentElement) { sup.parentElement.style.background = s.accent; sup.parentElement.style.color = (nombre === 'onyx-gold' || nombre === 'tech-neon') ? '#000' : '#fff'; }
            if (emitir && socket) socket.emit('actualizar_config', { skinSeleccionada: nombre });
        }

        function cambiarTamanoTexto(tipo, valor) {
            var val = parseInt(valor, 10); var r = document.documentElement;
            if (tipo === 'sup') { config.tamanoTextoSup = val; r.style.setProperty('--marquee-size-sup', val + 'px'); document.getElementById('lblTamanoSup').textContent = val + 'px'; } 
            else { config.tamanoTextoInf = val; r.style.setProperty('--marquee-size-inf', val + 'px'); document.getElementById('lblTamanoInf').textContent = val + 'px'; }
            if (socket) socket.emit('actualizar_config', { tamanoTextoSup: config.tamanoTextoSup, tamanoTextoInf: config.tamanoTextoInf });
        }
        function escapeHTML(s) { return !s ? '' : String(s).replace(/[&<>'"]/g, function(t) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t; }); }
        
        function reproducirAlertaSonora(tipo) {
            try {
                var AudioContextClass = window.AudioContext || window.webkitAudioContext; if (!AudioContextClass) return;
                var audioCtx = new AudioContextClass(); var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (tipo === 'listo') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); osc.frequency.setValueAtTime(1174.66, audioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9); osc.start(); osc.stop(audioCtx.currentTime + 0.9);
                } else {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.setValueAtTime(587.33, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch (e) {}
        }
        function activarAudioNavegador() { reproducirAlertaSonora('nuevo'); var btn = document.getElementById('btnActivarAudio'); if (btn) btn.classList.add('hidden'); }

        function entrarModo(modo) {
            rolActivo = modo; document.getElementById('pantalla-bienvenida').classList.add('hidden');
            if (modo === 'monitor') {
                document.getElementById('appTopBar').classList.add('hidden'); cambiarVista('pantalla-cliente'); renderizarMonitor(); iniciarCarruselPublicidad(); return;
            }
            document.getElementById('appTopBar').classList.remove('hidden'); configurarAppBottomBar(modo);
            if (modo === 'cliente') { cambiarVista('comandas'); renderizarMenu(); } 
            else if (modo === 'mesero') { cambiarVista('mapa'); renderizarMapa(); } 
            else if (modo === 'barra') { cambiarVista('barra'); renderizarBarra(); } 
            else if (modo === 'admin') { cambiarVista('mapa'); renderizarMapa(); renderizarAdmin(); }
        }

        function abrirModalLogin() { document.getElementById('modal-login').classList.remove('hidden'); document.getElementById('loginUsuario').value = ''; document.getElementById('loginPin').value = ''; document.getElementById('loginUsuario').focus(); }
        function cerrarModalLogin() { document.getElementById('modal-login').classList.add('hidden'); }
        function procesarLogin() {
            var usuario = document.getElementById('loginUsuario').value.trim().toLowerCase(); var pin = document.getElementById('loginPin').value.trim();
            if (!usuario || !pin) return alert('Ingresa usuario y PIN');
            if ((usuario === 'admin' && pin === '1234') || (usuario === 'mesero1' && pin === '1111') || (usuario === 'barra1' && pin === '2222')) {
                var rol = usuario === 'admin' ? 'admin' : (usuario === 'mesero1' ? 'mesero' : 'barra');
                usuarioActivo = { usuario: usuario, rol: rol, nombre: usuario.toUpperCase() }; cerrarModalLogin(); entrarModo(rol); return;
            }
            if (socket) {
                socket.emit('login_usuario', { usuario: usuario, pin: pin }, function(res) {
                    if (res && res.success) { usuarioActivo = { usuario: usuario, rol: res.rol, nombre: res.nombre }; cerrarModalLogin(); entrarModo(res.rol); } else alert(res.mensaje || 'PIN incorrecto');
                });
            } else alert('Credenciales no válidas');
        }

        function cerrarSesion() {
            usuarioActivo = null; rolActivo = 'cliente'; clearInterval(timerPublicidad); document.getElementById('pantalla-bienvenida').classList.remove('hidden'); document.getElementById('appTopBar').classList.add('hidden');
            ['comandas', 'barra', 'inventario', 'admin', 'pantalla-cliente', 'mapa'].forEach(function(x) { var el = document.getElementById('vista-' + x); if (el) el.classList.add('hidden'); });
        }

        function cambiarVista(v) {
            ['comandas', 'barra', 'inventario', 'admin', 'pantalla-cliente', 'mapa'].forEach(function(x) { var el = document.getElementById('vista-' + x); if (el) el.classList.add('hidden'); });
            var vActiva = document.getElementById('vista-' + v); if (vActiva) vActiva.classList.remove('hidden');
            if (v === 'inventario') renderizarInventario(); if (v === 'barra') renderizarBarra();
            if (v === 'admin') renderizarAdmin(); if (v === 'mapa') renderizarMapa();
            if (v === 'pantalla-cliente') { renderizarMonitor(); iniciarCarruselPublicidad(); } else clearInterval(timerPublicidad);
        }

        function configurarAppBottomBar(rol) {
            var bar = document.getElementById('appBottomBar'); if (!bar) return; bar.classList.remove('hidden');
            if (rol === 'cliente') {
                bar.innerHTML = '<div class="flex justify-around items-center w-full max-w-md mx-auto py-2"><button onclick="cambiarVista(\'comandas\')" class="flex flex-col items-center text-accent text-xs font-bold transition"><span class="text-xl">🍕</span><span>Menú</span></button></div>';
            } else if (rol === 'mesero') {
                bar.innerHTML = '<div class="flex justify-around items-center w-full max-w-lg mx-auto py-2">' +
                    '<button onclick="cambiarVista(\'mapa\')" class="flex flex-col items-center text-accent text-xs font-bold transition"><span class="text-xl">🗺️</span><span>Mapa / Caja</span></button>' +
                    '<button onclick="cambiarVista(\'comandas\')" class="flex flex-col items-center text-gray-400 text-xs font-bold transition"><span class="text-xl">📝</span><span>Levantar Orden</span></button>' +
                    '<button onclick="cambiarVista(\'pantalla-cliente\')" class="flex flex-col items-center text-gray-400 text-xs font-bold transition"><span class="text-xl">📺</span><span>Monitor</span></button></div>';
            } else if (rol === 'barra') {
                bar.innerHTML = '<div class="flex justify-around items-center w-full max-w-sm mx-auto py-2">' +
                    '<button onclick="cambiarVista(\'barra\')" class="flex flex-col items-center text-accent text-xs font-bold transition"><span class="text-xl">🍻</span><span>Barra</span></button>' +
                    '<button onclick="cambiarVista(\'pantalla-cliente\')" class="flex flex-col items-center text-gray-400 text-xs font-bold transition"><span class="text-xl">📺</span><span>Monitor</span></button></div>';
            } else if (rol === 'admin') {
                bar.innerHTML = '<div class="flex justify-around items-center w-full max-w-2xl mx-auto py-2">' +
                    '<button onclick="cambiarVista(\'mapa\')" class="flex flex-col items-center text-accent text-xs font-bold transition"><span class="text-xl">🗺️</span><span>Mapa / Caja</span></button>' +
                    '<button onclick="cambiarVista(\'admin\')" class="flex flex-col items-center text-gray-400 text-xs font-bold transition"><span class="text-xl">📊</span><span>Dashboard</span></button>' +
                    '<button onclick="cambiarVista(\'comandas\')" class="flex flex-col items-center text-gray-400 text-xs font-bold transition"><span class="text-xl">📝</span><span>Menú</span></button>' +
                    '<button onclick="cambiarVista(\'barra\')" class="flex flex-col items-center text-gray-400 text-xs font-bold transition"><span class="text-xl">🍻</span><span>Barra</span></button>' +
                    '<button onclick="cambiarVista(\'inventario\')" class="flex flex-col items-center text-gray-400 text-xs font-bold transition"><span class="text-xl">📦</span><span>Stock</span></button></div>';
            }
        }

        // ======================= NUEVO: MAPA DE MESAS Y COBRO INTEGRADO =======================
        function renderizarMapa() {
            var grid = document.getElementById('gridMapaMesas');
            if (!grid) return;
            // Configuración de lugares físicos
            var mesasConfiguradas = ['Mesa 1', 'Mesa 2', 'Mesa 3', 'Mesa 4', 'Mesa 5', 'Mesa 6', 'Barra', 'Para Llevar'];
            
            grid.innerHTML = mesasConfiguradas.map(function(mesa) {
                var activas = comandas.filter(function(c) { return c.mesa === mesa; });
                var totalMesa = activas.reduce(function(acc, c) { return acc + c.total; }, 0);
                
                var colorClase = 'bg-gray-900 border-gray-700 hover:border-gray-500'; 
                var estadoTexto = 'Mesa Libre';
                var icono = '🍽️';
                var animacion = '';
                
                if (activas.length > 0) {
                    var hayListas = activas.some(function(c) { return c.estado === 'Listo'; });
                    if (hayListas) {
                        colorClase = 'bg-blue-900 border-blue-400 text-blue-100 shadow-[0_0_15px_rgba(59,130,246,0.5)]';
                        estadoTexto = '¡Entregar Pedido!';
                        icono = '🔔';
                        animacion = 'animate-pulse';
                    } else {
                        colorClase = 'bg-red-900 border-red-500 text-red-100 shadow-[0_0_15px_rgba(239,68,68,0.3)]';
                        estadoTexto = 'Ocupada / Esperando';
                        icono = '🔥';
                    }
                }
                
                return '<div onclick="gestionarClicMesa(\'' + mesa + '\')" class="p-5 rounded-3xl border-2 cursor-pointer transition transform hover:scale-105 flex flex-col items-center justify-center text-center ' + colorClase + ' ' + animacion + '">' +
                    '<span class="text-4xl mb-2 drop-shadow-md">' + icono + '</span>' +
                    '<h3 class="font-black text-sm uppercase tracking-wide">' + mesa + '</h3>' +
                    '<span class="text-[10px] font-bold px-2 py-0.5 bg-black bg-opacity-50 rounded-lg mt-1">' + estadoTexto + '</span>' +
                    (activas.length > 0 ? '<span class="text-xs mt-2 text-green-400 font-black bg-black bg-opacity-40 px-3 py-1 rounded-xl">Por Cobrar: $' + totalMesa.toFixed(2) + '</span>' : '') +
                    '</div>';
            }).join('');
        }

        function gestionarClicMesa(mesa) {
            var activas = comandas.filter(function(c) { return c.mesa === mesa; });
            if (activas.length === 0) {
                // Mesa libre: ir a tomar orden
                miMesaAsignada = mesa;
                var sm = document.getElementById('selectMesa');
                if(sm) sm.value = mesa;
                document.getElementById('labelMesaAsignada').textContent = mesa;
                cambiarVista('comandas');
            } else {
                // Mesa ocupada: Abrir modal de COBRO directo (tomando la primera comanda activa para simplificar)
                abrirCobro(activas[0].id);
            }
        }

        // ======================= CALCULADORA =======================
        function calcNum(n) { if (calcReset || calcDisplay === '0') { calcDisplay = String(n); calcReset = false; } else { calcDisplay += String(n); } actualizarCalcDisplay(); }
        function calcPunto() { if (calcReset) { calcDisplay = '0.'; calcReset = false; } else if (calcDisplay.indexOf('.') === -1) { calcDisplay += '.'; } actualizarCalcDisplay(); }
        function calcOp(op) { calcPrevio = parseFloat(calcDisplay); calcOperacion = op; calcReset = true; }
        function calcIgual() {
            if (calcOperacion === null || calcPrevio === null) return;
            var actual = parseFloat(calcDisplay); var resultado = 0;
            if (calcOperacion === '+') resultado = calcPrevio + actual; if (calcOperacion === '-') resultado = calcPrevio - actual;
            if (calcOperacion === '*') resultado = calcPrevio * actual; if (calcOperacion === '/') resultado = actual !== 0 ? (calcPrevio / actual) : 0;
            calcDisplay = String(parseFloat(resultado.toFixed(2))); calcOperacion = null; calcPrevio = null; calcReset = true; actualizarCalcDisplay();
        }
        function calcClear() { calcDisplay = '0'; calcPrevio = null; calcOperacion = null; calcReset = false; actualizarCalcDisplay(); }
        function calcUsarMontoRecibido() { var input = document.getElementById('cobroMontoRecibido'); if (input) { input.value = calcDisplay; actualizarTotalCobro(); } }
        function actualizarCalcDisplay() { var el = document.getElementById('calcPantalla'); if (el) el.textContent = calcDisplay; }

        function abrirCajaTurno() { var m = prompt("Fondo inicial ($):", "500"); if (m !== null && !isNaN(parseFloat(m))) { if (socket) socket.emit('abrir_caja', parseFloat(m)); } }
        function registrarGastoOperativo() { var c = prompt("Concepto:"); var m = prompt("Monto ($):"); if (c && m && !isNaN(parseFloat(m))) { if (socket) socket.emit('registrar_egreso', { concepto: c, monto: parseFloat(m) }); } }
        function ejecutarCorteCaja() { if (confirm("¿Cerrar caja y reiniciar registros?")) { if (socket) socket.emit('cerrar_corte_caja', function(res) { if (res && res.success) alert("Caja cerrada exitosamente."); }); } }

        function renderizarAdmin() {
            var totalVentas = historialVentas.reduce(function(a, b) { return a + (b.total || 0); }, 0);
            var totalEgresos = egresos.reduce(function(a, b) { return a + (b.monto || 0); }, 0);
            var totalGanancia = historialVentas.reduce(function(a, b) { return a + (b.gananciaNeta || (b.total * 0.45)); }, 0);
            var fondo = caja.fondoInicial || 0;
            // El efectivo esperado solo suma las ventas que se pagaron en "Efectivo"
            var ventasEfectivo = historialVentas.filter(function(v){ return v.metodoPago === 'Efectivo'; }).reduce(function(a,b){ return a + b.total; }, 0);
            var dineroEsperadoEfectivo = fondo + ventasEfectivo - totalEgresos;

            document.getElementById('lblFondoInicial').textContent = '$' + fondo.toFixed(2); document.getElementById('lblTotalIngresos').textContent = '$' + totalVentas.toFixed(2);
            document.getElementById('lblTotalEgresos').textContent = '$' + totalEgresos.toFixed(2); document.getElementById('lblGananciaNeta').textContent = '$' + totalGanancia.toFixed(2); document.getElementById('lblEfectivoEsperado').textContent = '$' + dineroEsperadoEfectivo.toFixed(2);
            var badgeCaja = document.getElementById('badgeEstadoCaja');
            if (caja.abierta) { badgeCaja.textContent = "ABIERTA (" + caja.horaApertura + ")"; badgeCaja.className = "pill-badge text-green-400 bg-green-900 border border-green-800"; } 
            else { badgeCaja.textContent = "CERRADA"; badgeCaja.className = "pill-badge text-red-400 bg-red-900 border border-red-800"; }

            var ventasPorMesero = {};
            historialVentas.forEach(function(v) {
                var m = v.mesero || 'General'; if (!ventasPorMesero[m]) ventasPorMesero[m] = { total: 0, propinas: 0, pedidos: 0 };
                ventasPorMesero[m].total += v.total; ventasPorMesero[m].propinas += (v.propina || 0); ventasPorMesero[m].pedidos++;
            });

            var listaMeseros = document.getElementById('listaRendimientoMeseros'); var nombresM = Object.keys(ventasPorMesero);
            if (nombresM.length === 0) { listaMeseros.innerHTML = '<p class="text-xs text-gray-500">Sin órdenes cobradas hoy</p>'; } 
            else {
                listaMeseros.innerHTML = nombresM.map(function(nom) {
                    var dat = ventasPorMesero[nom];
                    return '<div class="flex justify-between items-center bg-app-base p-3 rounded-xl border border-gray-800 text-xs"><div><strong class="text-accent">' + escapeHTML(nom) + '</strong> (' + dat.pedidos + ' comandas)</div><div class="text-right">Venta: <strong class="text-green-400">$' + dat.total.toFixed(2) + '</strong> | Propina: <span class="text-blue-400">$' + dat.propinas.toFixed(2) + '</span></div></div>';
                }).join('');
            }
            actualizarGraficaFinanzas(totalVentas, totalEgresos, totalGanancia); renderizarListaUsuarios();
        }

        function actualizarGraficaFinanzas(ventas, egresos, ganancias) {
            var ctx = document.getElementById('chartFinanzas'); if (!ctx) return;
            if (chartVentas) chartVentas.destroy();
            chartVentas = new Chart(ctx, { type: 'bar', data: { labels: ['Ventas Brutas', 'Egresos', 'Ganancia Neta'], datasets: [{ label: 'Balance ($)', data: [ventas, egresos, ganancias], backgroundColor: ['#10b981', '#ef4444', '#a855f7'], borderRadius: 8 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#9ca3af' }, grid: { color: '#181824' } }, x: { ticks: { color: '#9ca3af' }, grid: { display: false } } } } });
        }

        function renderizarMonitor() {
            var sup = document.getElementById('marqueePromoSuperior'); var inf = document.getElementById('marqueePromoInferior');
            if (sup) sup.textContent = config.promoTexto || '¡BIENVENIDOS!'; if (inf) inf.textContent = config.promoTextoInferior || 'CONSULTA NUESTRAS PROMOCIONES';
            var cont = document.getElementById('gridPantallaEstado');
            if (cont) {
                cont.innerHTML = comandas.length === 0 ? '<p class="text-gray-500 text-center py-10 text-xs">Sin órdenes en preparación</p>' :
                    comandas.map(function(c) {
                        return '<div class="p-3.5 rounded-2xl border ' + (c.estado === 'Listo' ? 'bg-green-900 bg-opacity-70 border-green-400 text-green-200' : 'bg-app-input border-gray-800 text-white') + ' flex justify-between items-center text-xs shadow-xl">' +
                            '<div><span class="font-black text-sm block tracking-wide">' + escapeHTML(c.mesa) + '</span><span class="text-xxs text-gray-400">' + c.items.length + ' artículos</span></div>' +
                            '<span class="pill-badge uppercase ' + (c.estado === 'Listo' ? 'bg-green-500 text-black animate-bounce font-black' : 'bg-accent border border-accent') + '">' + escapeHTML(c.estado) + '</span></div>';
                    }).join('');
            }
            var qrCont = document.getElementById('qrRedesPublico');
            if (qrCont && typeof QRCode !== 'undefined') { qrCont.innerHTML = ''; new QRCode(qrCont, { text: config.redesUrl || ('http://' + ipServidor), width: 140, height: 140 }); }
